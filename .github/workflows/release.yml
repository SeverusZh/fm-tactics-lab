name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web run build
      - run: node tests/test_i18n.cjs
      - run: node tests/test_workspace_scripts.cjs
      - run: python scripts/build_sidecar.py
      - run: python -m pytest -q
      - run: python -m unittest discover -s tests
      - run: python scripts/check_manifest.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm install --global @tauri-apps/cli@^2
      - run: tauri build --bundles nsis
      - name: Install and uninstall the release candidate
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing" }
          ./scripts/verify_installer_windows.ps1 -InstallerPath $installer.FullName -EvidenceDir dist/installer-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-installer-qa
          path: dist/installer-qa
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing" }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title $env:GITHUB_REF_NAME --generate-notes
