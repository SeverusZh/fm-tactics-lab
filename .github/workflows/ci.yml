name: CI

on:
  push:
    branches: ["refactor/v2-modular"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m unittest discover -s tests
      - run: python scripts/check_manifest.py
      - run: python -c "import json; json.load(open('src-tauri/tauri.conf.json', encoding='utf-8')); json.load(open('src-tauri/capabilities/default.json', encoding='utf-8'))"
      - run: ruff check fm27lab

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web run build

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml -p fm27lab-core

  windows-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
      - run: python scripts/build_sidecar.py
      - run: python -m pytest fm27lab/tests -q
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm install --global @tauri-apps/cli@^2
      - run: tauri build --bundles nsis
      - name: Verify sidecar resource and installer
        shell: pwsh
        run: |
          $sidecars = Get-ChildItem -Path src-tauri/target/release -Recurse -Filter fm27lab-sidecar.exe -ErrorAction SilentlyContinue
          if (-not $sidecars) { throw "sidecar executable missing from build tree" }
          $sidecars | ForEach-Object { Write-Host $_.FullName }
          $installers = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $installers) { throw "NSIS installer missing" }
          $installers | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
