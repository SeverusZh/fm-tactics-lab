[package]
name = "fm27lab-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Tauri desktop shell for FM Tactics Lab"
publish = false

[lib]
name = "fm27lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fm27lab-core = { path = "../rust/crates/fm27lab-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
